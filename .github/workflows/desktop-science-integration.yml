name: Real Desktop scientific integration

on:
  workflow_dispatch:
  push:
    branches: [feature/full-desktop-preparation]
    paths:
      - 'src/geco_desktop/backend/**'
      - 'src/geco_desktop/environments.py'
      - 'src/geco_desktop/sessions.py'
      - 'tests/integration/**'
      - '.github/workflows/desktop-science-integration.yml'

permissions:
  contents: read

jobs:
  real-desktop-science:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCIENCE_ENV: /tmp/geco-desktop-science
      OUTPUT_ROOT: /tmp/geco-desktop-science-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install host Desktop package
        run: python -m pip install -e .
      - name: Install scientific stack in isolated interpreter
        run: |
          uv venv --python 3.11 "$SCIENCE_ENV"
          uv pip install --python "$SCIENCE_ENV/bin/python" \
            'git+https://github.com/zacthinks/GeCo.git@v0.9.0' \
            'https://github.com/zacthinks/text-analysis-lab/releases/download/v0.10.0/text_analysis_lab-0.10.0-py3-none-any.whl'
      - name: Exercise real Desktop runner with TeAL and GeCo
        run: |
          python -u tests/integration/scientific_backend_smoke.py \
            --science-python "$SCIENCE_ENV/bin/python" --output-root "$OUTPUT_ROOT"
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-integration-diagnostics
          path: /tmp/geco-desktop-science-smoke/desktop-session-registry/logs/
          if-no-files-found: ignore
          retention-days: 7
