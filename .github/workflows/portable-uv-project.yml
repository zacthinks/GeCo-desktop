name: Portable uv project qualification

on:
  workflow_dispatch:
  # One-time branch qualification when this separate integration script changes.
  # This does not run as part of normal per-commit unit/GUI CI.
  push:
    branches: [feature/portable-uv-project-foundation]
    paths:
      - tests/integration/portable_project_qualification.py

jobs:
  portable-uv-project:
    name: Lock and relocate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install Desktop test package
        run: python -m pip install -e .
      - name: Resolve official wheels, relocate project and validate lock
        run: python tests/integration/portable_project_qualification.py
