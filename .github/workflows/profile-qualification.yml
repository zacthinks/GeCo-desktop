name: Full scientific profile qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/integration/profile_qualification.py'
      - '.github/workflows/profile-qualification.yml'
      - 'src/geco_desktop/science_releases.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the Desktop backend
        run: python -m pip install -e .
      - name: Resolve and exercise exact full scientific profile
        env:
          UV_HTTP_TIMEOUT: '60'
        run: python -u tests/integration/profile_qualification.py
      - name: Preserve verified profile manifest
        uses: actions/upload-artifact@v4
        with:
          name: profile-candidate-${{ matrix.os }}
          path: candidate-profile-*.json
          if-no-files-found: error
          retention-days: 14
