name: Portable scientific runtime

on:
  workflow_dispatch:
  push:
    branches: [feature/full-desktop-preparation]
    paths:
      - 'src/geco_desktop/environments.py'
      - 'src/geco_desktop/project.py'
      - 'src/geco_desktop/backend/**'
      - 'tests/integration/portable_runtime_qualification.py'
      - '.github/workflows/portable-science-runtime.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install host Desktop code
        run: python -m pip install -e .
      - name: Resolve universal runtime lock and create portable descriptor
        run: |
          python -u tests/integration/portable_runtime_qualification.py resolve --output portable-source --pdf
      - uses: actions/upload-artifact@v4
        with:
          name: portable-science-descriptor
          path: portable-source/Qualification.gecod/project.gecod
          if-no-files-found: error
          retention-days: 7

  reconstruct:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install host Desktop code
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: portable-science-descriptor
          path: portable-source/Qualification.gecod
      - name: Reconstruct environment from unchanged portable lock
        shell: bash
        run: |
          python -u tests/integration/portable_runtime_qualification.py install --project portable-source/Qualification.gecod --output portable-reconstruction
