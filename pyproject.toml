[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geco-desktop"
version = "0.1.0.dev0"
description = "Native project factory and launcher for TeAL-linked GeCo workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4,<6", "filelock>=3.16,<4", "psutil>=6,<8"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
geco-desktop = "geco_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"geco_desktop.backend" = ["runner.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
